name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build signed release APK (tests run first)
        run: gradle testReleaseUnitTest assembleRelease -PversionCodeOverride=${{ github.run_number }} --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk life-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: life-tracker-apk
          path: life-tracker.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Life Tracker build ${{ github.run_number }}
          files: life-tracker.apk
          make_latest: "true"
