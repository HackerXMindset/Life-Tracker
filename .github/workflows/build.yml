name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build signed release APK (tests run first)
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease -PversionCodeOverride=${{ github.run_number }} --no-daemon 2>&1 | tee build.log

      # If the build fails, show the first error lines as annotations on the run, so they can be read without opening the full log.
      - name: Show why the build failed
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Could not resolve|AssertionError|Execution failed|Manifest merger|^> " build.log | head -40 | sed 's/%/%25/g' > errors.txt || true
          echo "::error title=Build errors::$(paste -sd '|' errors.txt | head -c 3500)"

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk life-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: life-tracker-apk
          path: life-tracker.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Life Tracker build ${{ github.run_number }}
          files: life-tracker.apk
          make_latest: "true"
